app-id: io.emeric.watchflower
runtime: org.kde.Platform
runtime-version: '6.10'
sdk: org.kde.Sdk
command: watchflower
rename-desktop-file: watchflower.desktop
rename-appdata-file: watchflower.appdata.xml
rename-icon: watchflower

finish-args:
  # Our UI is GPU accelerated
  - --device=dri
  # X11 + XShm access
  - --share=ipc
  - --socket=fallback-x11
  # Wayland access
  - --socket=wayland
  # We need Bluetooth support
  - --allow=bluetooth
  - --system-talk-name=org.bluez
  # We can use network to connect to remote database
  - --share=network

modules:

  - name: watchflower
    buildsystem: qmake
    post-install:
      - install -Dm644 watchflower.appdata.xml -t /app/share/metainfo/
    sources:
      - type: archive
        url: https://github.com/emericg/WatchFlower/archive/refs/tags/v5.4.tar.gz
        sha256: e0504be0ae5ac5843b19bfd57a59e47dd93a93067790fc5b865994defe312729
      - type: file
        path: watchflower.appdata.xml
